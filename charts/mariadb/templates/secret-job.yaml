{{- if .Values.job.enabled }}
{{- $connection := printf "--host=%s --user=%s --password=%s" (include "common.names.fullname" .) "root" "${MARIADB_ROOT_PASSWORD}" }}
---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "{{ include "common.names.fullname" . }}-job"
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" . ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" . ) | nindent 4 }}
  {{- end }}
stringData:
  init-wait.sh: |
    RETRIES={{ .Values.job.retries }}
    until mysqladmin status {{ $connection }} > /dev/null 2>&1 || [ $RETRIES -eq 0 ]; do
      echo "Waiting {{ .Values.job.wait }}s for mariadb server, $((RETRIES--)) remaining attempts..."
      sleep {{ .Values.job.wait }}
    done
    if [ ${RETRIES} -eq "0" ]; then
      echo "Maximum wait attempts exceeded, aborting".
      exit 1;
    fi
  init-user.sh: |
    {{- range .Values.job.users }}
    mysql {{ $connection }} -e "CREATE USER IF NOT EXISTS '{{ tpl .username $ }}'@'%' IDENTIFIED BY '{{ tpl .password $ }}';"
    {{- end }}
  init-db.sh: |
    {{- range .Values.job.databases }}
    mysql {{ $connection }} -e "CREATE DATABASE IF NOT EXISTS {{ tpl .name $ }};"
    mysql {{ $connection }} -e "GRANT ALL PRIVILEGES ON {{ tpl .name $ }}.* TO '{{ tpl .user $ }}'@'%';"
    mysql {{ $connection }} -e "FLUSH PRIVILEGES;"
    {{- end }}
...
{{- end }}
